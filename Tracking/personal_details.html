<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/personal_details.css">
</head>
<body>

<!-- Backdrop with Blur Effect -->
<div class="modal-backdrop" id="modalBackdrop"></div>

<div class="profile-container">

    <!-- Top Left Floating Back Button -->
    <a href="dashboard.html" class="back-btn-floating" aria-label="Back to Dashboard">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Back to Dashboard</span>
    </a>

    <!-- Profile Popup Card -->
    <div class="profile-card">

        <div class="profile-avatar">
            <h1 id="profileInitials">A</h1>
        </div>

        <h2 id="profileName">Akshay Kumar</h2>
        <p id="profileEmail">aksh77201@gmail.com</p>

        <div class="details">

            <div class="detail-box">
                <span>Age</span>
                <h3 id="profileAge">—</h3>
            </div>

            <div class="detail-box">
                <span>Gender</span>
                <h3 id="profileGender">—</h3>
            </div>

            <div class="detail-box">
                <span>Height</span>
                <h3 id="profileHeight">—</h3>
            </div>

            <div class="detail-box">
                <span>Weight</span>
                <h3 id="profileWeight">—</h3>
            </div>

            <div class="detail-box bmi">
                <span>BMI</span>
                <h3 id="profileBMI">—</h3>
            </div>

        </div>

    </div>

</div>

<script src="js/personal_details.js"></script>
